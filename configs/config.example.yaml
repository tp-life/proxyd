# proxyd 配置示例
# 订阅列表：可同时配置多个机场，type 默认 auto（自动嗅探内容格式）。
# Clash YAML 节点里的 dialer-proxy 会原样保留，可引用同订阅节点或下方 groups 的名称。
subscriptions:
  - name: airport-a
    url: https://example.com/api/v1/client/subscribe?token=xxx
    # type: auto | clash | share
  - name: airport-b
    url: https://example2.com/link/base64

# manual-nodes:                # 手动添加的自有代理节点（持久化在此文件，来源标记为 manual）
#   - http://user:pass@1.2.3.4:8080#我的HTTP节点    # http(s)://[user:pass@]host:port[#名称]
#   - socks5://user:pass@1.2.3.4:1080               # socks5://[user:pass@]host:port[#名称]
#   - ss://YWVzLTEyOC1nY206cHc=@1.2.3.4:8388#ss节点  # 以及 ss/ssr/vmess/vless/trojan/hy2/tuic 分享链接

listen: 127.0.0.1              # 映射端口监听地址
port-range: [42000, 42100]     # 每个可用节点占一个端口（闭区间）
# port-mapping: true           # 是否启动逐节点端口监听；关闭后保留稳定分配关系，但不再暴露这些监听端口
mixed-port: 41999              # 主端口：走全局规则模式（rule/global/direct），默认区间前一位
# main-auto: false             # true 时主端口跳过规则、固定走最优节点（AUTO url-test 组）；
                               # 与 auto-port 并存互不影响；无可用节点时回退规则模式
# main-node: ""                # 主端口固定节点（存节点 Key：协议|地址|端口|凭据，Web/CLI 设置时自动填）；
                               # 空=跟随规则；main-auto 开启时被忽略（auto 优先）；
                               # 节点失效/消失时回退规则模式，配置保留，恢复后自动再生效
# auto-port: 41998             # 自动选优端口：固定走全部可用节点中延迟最低者（url-test）；0/不填=关闭
# system-proxy: false          # true 时 serve 启动后把系统代理指向主端口，退出时自动恢复

# tun:                         # TUN 接管系统 TCP/UDP 流量；其余 mihomo 高级字段会原样透传
#   enable: false              # Web / proxyd tun on|off 可热切换并持久化
#   stack: system              # system 无额外构建标签；gvisor/mixed 需 with_gvisor 构建
#   auto-route: true           # 自动配置系统路由
#   auto-detect-interface: true # 自动识别出口网卡
#   dns-hijack:
#     - 0.0.0.0:53             # 劫持 IPv4 DNS；启用时建议同时配置 dns 或 DNS 预设

refresh-interval: 24h          # 订阅刷新周期（默认一天一次；可随时在 Web 控制台手动刷新）
health-interval: 5m            # 节点可用性检测周期
health-url: https://www.gstatic.com/generate_204
health-timeout: 5s
check-updates: true            # 启动后异步检查官方 GitHub Releases；失败不影响代理，可设 false 关闭
# include: "香港|日本"                    # 可选白名单：只保留名称匹配的节点
exclude: "到期|剩余流量|套餐|官网|订阅"   # 黑名单：在 include 之后剔除匹配节点

# ---- 以下为 Clash 语义的全局配置，作用于主端口 ----
mode: rule                     # rule | global | direct
log-level: info
external-controller: 127.0.0.1:19090   # mihomo REST API（兼容 metacubexd/yacd 面板）
api-listen: 127.0.0.1:19091            # proxyd 自有 API + 内嵌 React Web 控制台
# secret: change-me
# external-ui: ui              # 可放 metacubexd 静态文件目录

# custom-rules:                # 追加式自定义规则：生成时前置到 rules 之前，先生效
#   - DOMAIN-SUFFIX,example.com,DIRECT        # 策略可填 DIRECT/REJECT/节点名/分组名
#   - IP-CIDR,10.0.0.0/8,REJECT,no-resolve

# rule-urls:                   # 远程规则源：跟随订阅刷新拉取，内容缓存在 state-dir（不写回此文件）
#   - name: gfwlist            # 支持 mihomo 规则文本（每行 类型,内容,策略）
#     url: https://example.com/gfwlist.txt   # 和 gfwlist/AutoProxy（base64）两种格式，自动识别

# groups:                      # 节点分组端口，也可作为订阅节点 dialer-proxy 的上游目标
#   - name: hk                 # 组名（不能与节点名/AUTO/PROXY 等保留名冲突）
#     port: 43000              # 不能与主端口、api 端口、port-range 区间、auto-port 冲突
#     type: fallback           # url-test | fallback | load-balance；旧配置缺省为 url-test
#     nodes: ["香港 01", "香港 02"]   # 节点名列表，与当前可用节点取交集
#   - name: airport-a-auto
#     port: 43001
#     type: url-test
#     subscription: airport-a  # 成员动态取该订阅当前可用节点；manual 表示手动节点来源

# dns-preset: off              # off | fake-ip | redir-host；TUN 建议 fake-ip
# dns:                         # 可选，透传 mihomo dns 配置；存在时优先于 dns-preset
#   enable: true
#   enhanced-mode: fake-ip

rules:
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,PROXY

# state-dir: ~/.local/state/proxyd   # 状态目录：端口映射快照 mapping.json、节点快照 nodes.json、
                                     # 订阅/规则缓存 cache/（含 *.userinfo.json 用量缓存）、
                                     # geo 数据、proxyd.pid、proxyd.log
